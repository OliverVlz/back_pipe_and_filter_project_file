version: "3.9"

services:
  
  mongo-primary:
    image: mongo:6
    container_name: mongo-primary
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    volumes:
      - mongo_primary_data:/data/db
    networks:
      - mongo-network

  mongo-secondary-1:
    image: mongo:6
    container_name: mongo-secondary-1
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo_secondary1_data:/data/db
    depends_on:
      - mongo-primary
    networks:
      - mongo-network

  mongo-secondary-2:
    image: mongo:6
    container_name: mongo-secondary-2
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27020:27017"
    volumes:
      - mongo_secondary2_data:/data/db
    depends_on:
      - mongo-primary
    networks:
      - mongo-network

  mongo-init:
    image: mongo:6
    container_name: mongo-init
    restart: "no"
    depends_on:
      - mongo-primary
      - mongo-secondary-1
      - mongo-secondary-2
    networks:
      - mongo-network
    command: >
      mongosh --host mongo-primary:27017 --eval '
        rs.initiate({
          _id: "rs0",
          members: [
            { _id: 0, host: "mongo-primary:27017", priority: 2 },
            { _id: 1, host: "mongo-secondary-1:27017", priority: 1 },
            { _id: 2, host: "mongo-secondary-2:27017", priority: 1 }
          ]
        })
      '

  minio:
    image: minio/minio
    container_name: minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mongo-network

  file-pipeline-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-pipeline-processor
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://mongo-primary:27017,mongo-secondary-1:27017,mongo-secondary-2:27017/filesdb?replicaSet=rs0&readPreference=secondaryPreferred
      MINIO_URL: http://minio:9000
      RABBITMQ_HOST: rabbitmq
      FILESDB_URL: jdbc:mysql://mysql-master:3306/file_service_db?useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      - mongo-primary
      - mongo-secondary-1
      - mongo-secondary-2
      - minio
    networks:
      - mongo-network
      - file-service-network  # <-- AGREGAR ESTA LÍNEA

networks:
  mongo-network:
    driver: bridge
  file-service-network:     # <-- AGREGAR ESTE BLOQUE
    external: true

volumes:
  mongo_primary_data:
  mongo_secondary1_data:
  mongo_secondary2_data:
  minio_data: